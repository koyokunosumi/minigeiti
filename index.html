<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/minigeiti/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="絵文字のヒントから正解を推理するミニゲーム">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hollcard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>絵文字推理くん</title>
  <link rel="manifest" href="manifest.json">

  <!-- ========================================== -->
  <!-- 🐦 ここから X（Twitter）カード & OGP設定 -->
  <!-- ========================================== -->
  
  <!-- 1. 基本的なOGP設定（LINEやFacebook、Discordなどでも綺麗に出ます） -->
  <meta property="og:title" content="🔍 絵文字推理くん">
  <meta property="og:description" content="ヒントを頼りに絵文字の並びを推理する">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://koyokunosumi.github.io/minigeiti/">
  <!-- ※ og:image には公開後の絶対URLを指定するのが確実です -->
  <meta property="og:image" content="https://koyokunosumi.github.io/minigeiti/ogp_image.png">

  <!-- 2. X（Twitter）専用のカード設定 -->
  <meta name="twitter:card" content="summary_large_image"> <!-- 大きな画像で表示するカード -->
  <meta name="twitter:site" content="@koyokunosumi"> <!-- あなたのXのID（例: @koyokunosumi） -->
  <meta name="twitter:title" content="🔍 絵文字推理くん">
  <meta name="twitter:description" content="ヒントを頼りに絵文字の並びを推理せよする">
  <meta name="twitter:image" content="https://koyokunosumi.github.io/minigeiti/ogp_image.png">

  <!-- ========================================== -->
  <!-- 🐦 OGP設定ここまで -->
  <!-- ========================================== -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
